<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Asset Index</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #243249;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin: 0 0 10px 0;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .subtitle a {
            color: var(--accent-color);
            text-decoration: none;
            word-break: break-all;
        }

        /* --- Desktop & Tablet Layout (Standaard Tabel) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: table;
        }

        thead {
            display: table-header-group;
        }

        tr {
            display: table-row;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            display: table-cell;
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }
