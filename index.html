<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX v72 // TEMPORAL DECODER</title>
    <style>
        :root { 
            --amber: #ffbf00; 
            --blue: #00d2ff; 
            --bg: #050608; 
            --panel: #0a0c0f;
            --stone: #1a1a1a;
        }
        
        body { 
            background: var(--bg); 
            color: var(--amber); 
            font-family: 'Courier New', monospace; 
            padding: 40px 20px;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .header {
            text-align: center; 
            border-bottom: 1px solid #333; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
            width: 100%; 
            max-width: 600px;
        }

        .calculator-panel {
            background: var(--panel); 
            border: 1px solid #333; 
            padding: 30px; 
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            color: var(--blue);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            background: #000;
            border: 1px solid var(--amber);
            color: #fff;
            padding: 15px;
            font-size: 24px;
            font-family: inherit;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            box-shadow: 0 0 15px rgba(255, 191, 0, 0.4);
        }

        .results {
            border-top: 1px solid #222;
            padding-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result-box {
            background: #000;
            border: 1px solid var(--stone);
            padding: 15px;
            text-align: center;
        }

        .result-label {
            font-size: 10px;
            color: #777;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 18px;
            color: #fff;
        }

        .hebrew-display {
            grid-column: span 2;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid var(--blue);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .hebrew-letter {
            font-size: 64px;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px var(--blue);
        }

        .hebrew-name {
            font-size: 20px;
            font-weight: bold;
            color: var(--blue);
        }

        .hebrew-meaning {
            font-size: 14px;
            color: #ccc;
        }

        .math-breakdown {
            grid-column: span 2;
            font-size: 11px;
            color: #555;
            line-height: 1.6;
            background: #000;
            padding: 15px;
            border: 1px dashed #333;
        }

        .highlight { color: var(--amber); }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="letter-spacing: 3px; margin: 0; color: var(--blue);">VORTEX TEMPORAL DECODER</h2>
        <div style="font-size: 11px; color: #777; margin-top: 5px;">INDEX / DAG NAAR ELS RESONANTIE (MOD 22)</div>
    </div>

    <div class="calculator-panel">
        <div class="input-group">
            <label for="dayInput">Voer Dag / Index in (bijv. 367)</label>
            <input type="number" id="dayInput" value="367" min="0">
        </div>

        <div class="results">
            <div class="result-box">
                <div class="result-label">BINAIR (B)</div>
                <div class="result-value" id="valBin">0</div>
            </div>
            <div class="result-box">
                <div class="result-label">GRAY CODE (G)</div>
                <div class="result-value highlight" id="valGray">0</div>
            </div>
            
            <div class="hebrew-display">
                <div class="result-label">HEBREEUWSE RESONANTIE (G MOD 22)</div>
                <div class="hebrew-letter" id="hebLetter">א</div>
                <div class="hebrew-name" id="hebName">Alef</div>
                <div class="hebrew-meaning" id="hebMeaning">Rund / Leider / Eerste</div>
            </div>

            <div class="math-breakdown" id="mathBreakdown">
                > Wachten op berekening...
            </div>
        </div>
    </div>

    <script>
        const hebrewDict = [
            { l: 'א', n: 'Alef', d: 'Rund / Leider / Eerste' },
            { l: 'ב', n: 'Bet', d: 'Huis / In' },
            { l: 'ג', n: 'Giemel', d: 'Kameel / Brug' },
            { l: 'ד', n: 'Dalet', d: 'Deur / Arm' },
            { l: 'ה', n: 'He', d: 'Venster / Kijk!' },
            { l: 'ו', n: 'Waw', d: 'Haak / Verbinding' },
            { l: 'ז', n: 'Zajien', d: 'Zwaard / Wapens' },
            { l: 'ח', n: 'Chet', d: 'Omheining / Muur' },
            { l: 'ט', n: 'Tet', d: 'Slang / Mand' },
            { l: 'י', n: 'Jod', d: 'Hand / Werk' },
            { l: 'כ', n: 'Kaf', d: 'Handpalm / Kracht' },
            { l: 'ל', n: 'Lamed', d: 'Osseprik / Onderwijzen' },
            { l: 'מ', n: 'Mem', d: 'Water / Chaos' },
            { l: 'נ', n: 'Noen', d: 'Vis / Leven' },
            { l: 'ס', n: 'Samech', d: 'Steun / Doorn' },
            { l: 'ע', n: 'Ajien', d: 'Oog / Bron' },
            { l: 'פ', n: 'Pe', d: 'Mond / Spreken' },
            { l: 'צ', n: 'Tsade', d: 'Vishaak / Rechtvaardige' },
            { l: 'ק', n: 'Kof', d: 'Achterhoofd / Naald' },
            { l: 'ר', n: 'Resj', d: 'Hoofd / Belangrijkste' },
            { l: 'ש', n: 'Sjien', d: 'Tand / Vernietigen' },
            { l: 'ת', n: 'Taw', d: 'Teken / Kruis' }
        ];

        const dayInput = document.getElementById('dayInput');
        
        function calculateResonance() {
            let inputVal = parseInt(dayInput.value);
            if (isNaN(inputVal) || inputVal < 0) {
                inputVal = 0;
            }

            // 1. Binair
            const binStr = inputVal.toString(2);
            document.getElementById('valBin').innerText = binStr;

            // 2. Gray Code
            const grayVal = inputVal ^ (inputVal >> 1);
            const grayBinStr = grayVal.toString(2);
            document.getElementById('valGray').innerText = `${grayVal} (${grayBinStr})`;

            // 3. Modulo 22
            const mod22 = grayVal % 22;
            const data = hebrewDict[mod22];

            // 4. Update UI
            document.getElementById('hebLetter').innerText = data.l;
            document.getElementById('hebName').innerText = data.n;
            document.getElementById('hebMeaning').innerText = data.d;

            // 5. Wiskundige uitsplitsing
            const breakdown = `
                > 1. Invoerwaarde (B): ${inputVal} (Binair: ${binStr})<br>
                > 2. Bit-shift (B >> 1): ${inputVal >> 1} (Binair: ${(inputVal >> 1).toString(2)})<br>
                > 3. Gray Code (G = B XOR B>>1): <span class="highlight">${grayVal}</span><br>
                > 4. Modulo Resonantie (${grayVal} / 22): Restwaarde <span class="highlight">${mod22}</span><br>
                > 5. Alfabet Index: ${mod22} ➔ ${data.n}
            `;
            document.getElementById('mathBreakdown').innerHTML = breakdown;
        }

        // Event listener voor live updates bij typen of klikken
        dayInput.addEventListener('input', calculateResonance);
        
        // Initialiseer met de standaardwaarde (367)
        calculateResonance();
    </script>
</body>
</html>
